<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Células - Iglesia MPN</title>
    <meta name="description" content="Mapa interactivo de células y casas de oración de la Iglesia Movimiento de Paz Nacional en Paraná, Entre Ríos.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="header-icon">📌</div>
            <div>
                <h1 class="header-title">Mapa de Células</h1>
                <p class="header-subtitle">Iglesia Movimiento de Paz Nacional · Paraná</p>
            </div>
        </div>
    </header>

    <div class="filtros-container">
        <div class="filtro-group">
            <label for="tipoSelect">Tipo</label>
            <select id="tipoSelect">
                <option value="todos">Todas</option>
                <option value="casa_oracion">Casas de Oración</option>
                <option value="casa_discipulado">Casas de Discipulado</option>
            </select>
        </div>
        <div class="filtro-group">
            <label for="redSelect">Red</label>
            <select id="redSelect">
                <option value="todas">Todas</option>
                <option value="mujeres">Mujeres</option>
                <option value="varones">Varones</option>
                <option value="jovenes">Jóvenes</option>
            </select>
        </div>
    </div>

    <div class="map-wrapper">
        <div id="map"></div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Mostrar lista">☰</button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <aside class="sidebar-panel">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Células</h2>
                <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar">✕</button>
            </div>
            <div class="sidebar-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar por dirección, líder, red..." autocomplete="off">
            </div>
            <div class="sidebar-list" id="cellList"></div>
            <div class="sidebar-footer">
                <span id="listCount">0 células</span>
            </div>
        </aside>
    </div>

    <footer class="app-footer">
        <span>Iglesia MPN</span>
        <span>Paraná, Entre Ríos</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="mapa.js"></script>
</body>
</html>
